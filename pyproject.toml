[project]
name = "sqlalchemylesson"
version = "0.1.0"
description = ""
authors = [
    {name = "vellimir",email = "kkazancov@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy (>=2.0.52,<3.0.0)",
    "fastapi (>=0.141.1,<0.142.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "alembic (>=1.19.2,<2.0.0)",
    "uvicorn (>=0.52.4,<0.53.0)",
    "ruff (>=0.16.6,<0.17.0)",
    "pre-commit (>=4.6.2,<5.0.0)"
]

[tool.mypy]
python_version = "3.12"
strict = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 78
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle
    "W",      # warnings
    "F",      # pyflakes
    "I",      # imports
    "B",      # bugbear
    "UP",     # modern Python
    "ANN",    # annotations
    "ARG",    # unused arguments
    "C4",     # comprehensions
    "DTZ",    # datetime/timezone
    "PTH",    # pathlib
    "SIM",    # simplifications
    "T20",    # print()
    "RET",    # return statements
    "RUF",    # Ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ANN",
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = false
